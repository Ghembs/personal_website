<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>汉字 · HSK 1–4 · Giuliano Gambacorta</title>
  <meta name="description" content="I caratteri cinesi dei livelli HSK 1–4 in 3D: livelli, radicali e famiglie fonetiche, con significati, parole d'uso e ordine dei tratti.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cinese.css">
</head>
<body>
  <canvas id="scene" touch-action="none"></canvas>

  <header id="bar">
    <a class="home" href="../" data-i18n="home">← giulianogambacorta</a>
    <h1><span class="hz">汉字</span> HSK 1–4</h1>
    <a class="intro" href="introduzione/" data-i18n="intro">introduzione</a>
    <div class="group" role="group" aria-label="Vista" data-i18n-attr="aria-label:aView">
      <button data-view="levels" class="on" data-i18n="vLevels">livelli</button>
      <button data-view="radicals" data-i18n="vRadicals">radicali</button>
      <button data-view="phonetic" data-i18n="vPhonetic">famiglie fonetiche</button>
    </div>
    <div class="group" role="group" aria-label="Livelli visibili" data-i18n-attr="aria-label:aLevels">
      <button data-level="1">1</button>
      <button data-level="2">2</button>
      <button data-level="3">3</button>
      <button data-level="4">4</button>
    </div>
    <div class="group" role="group" aria-label="Dimensioni" data-i18n-attr="aria-label:aDim">
      <button data-dim="2">2D</button>
      <button data-dim="3">3D</button>
    </div>
    <div class="group" role="group" aria-label="Colore" data-i18n-attr="aria-label:aColor">
      <button data-color="level" class="on" data-i18n="cLevel">colore: livello</button>
      <button data-color="tone" data-i18n="cTone">colore: tono</button>
    </div>
    <input id="search" type="search" placeholder="字, pinyin o inglese" data-i18n-attr="placeholder:search" autocomplete="off" spellcheck="false">
    <button id="theme" aria-label="Tema chiaro o scuro" title="Tema chiaro / scuro" data-i18n-attr="title:theme;aria-label:theme">◐</button>
    <button id="lang" title="English">EN</button>
  </header>

  <div id="legend"></div>
  <div id="hover" hidden></div>
  <div id="loading">caricamento…</div>

  <div id="results" hidden></div>

  <aside id="card" hidden>
    <button class="grip" aria-label="Riduci o espandi la scheda" data-i18n-attr="aria-label:aGrip"></button>
    <button class="close" aria-label="Chiudi" data-i18n-attr="aria-label:aClose">×</button>
    <div class="head">
      <div class="big hz"></div>
      <div class="meta">
        <div class="level"></div>
        <div class="readings"></div>
      </div>
      <div class="strokes">
        <div id="writer"></div>
        <div class="writer-tools">
          <button data-writer="play" data-i18n="strokesBtn">tratti</button>
          <button data-writer="quiz">esercitati</button>
          <button data-writer="done" data-i18n="done">fine</button>
        </div>
      </div>
    </div>
    <section class="meanings"></section>
    <section class="parts"></section>
    <section class="family"></section>
    <section class="relations"></section>
    <section class="examples"></section>
    <section class="words"></section>
    <footer class="sources" data-i18n="sources"></footer>
  </aside>

  <script src="../i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@9.28.0/babylon.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer.min.js"></script>
  <script src="voice.js"></script>
  <script src="cinese.js"></script>
</body>
</html>
