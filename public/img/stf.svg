  <!-- bell tower -->
  <path d="M182 208 V96 h34 V208 z" fill="#E9DCCB" stroke="#5B4237" stroke-width="5"/>
  <path d="M199 58 V96" stroke="#5B4237" stroke-width="5" stroke-linecap="round"/>
  <rect x="193" y="116" width="12" height="22" rx="5" fill="#5B4237"/>
  <rect x="193" y="156" width="12" height="22" rx="5" fill="#5B4237"/>
  <!-- dome on its drum -->
  <path d="M244 160 C244 112 272 90 296 90 C320 90 348 112 348 160 z" fill="#C0522D"/>
  <path d="M296 92 V160 M268 104 C260 120 258 140 258 160 M324 104 C332 120 334 140 334 160" stroke="#F3E8DA" stroke-width="4" fill="none"/>
  <rect x="288" y="66" width="16" height="26" rx="3" fill="#C0522D"/>
  <rect x="236" y="160" width="120" height="44" fill="#E9DCCB" stroke="#5B4237" stroke-width="5"/>
  <circle cx="264" cy="182" r="7" fill="#5B4237"/>
  <circle cx="296" cy="182" r="7" fill="#5B4237"/>
  <circle cx="328" cy="182" r="7" fill="#5B4237"/>
  <!-- stairway and handrail -->
  <path d="M24 344 V318 H66 V292 H108 V266 H150 V240 H192 V344 z" fill="#5B4237"/>
  <path d="M30 318 H66 M72 292 H108 M114 266 H150 M156 240 H192" stroke="#C0522D" stroke-width="8"/>
  <path d="M20 300 L132 236 C146 228 156 236 154 250 V262" stroke="#3A2A24" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
