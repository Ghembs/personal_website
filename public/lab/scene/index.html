<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compositore di scene · Giuliano Gambacorta</title>
  <meta name="description" content="Componi una scena ASCII animata: ambiente, ora, meteo, mezzi, monumenti, alberi, animali.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="scene.css">
</head>
<body>
  <header id="top">
    <a class="back" href="../" data-i18n="back">[ ← cesta dei giochi ]</a>
    <h1 data-i18n="title">compositore di scene</h1>
    <button id="lang">EN</button>
  </header>

  <section id="mix">
    <div class="mixhead">
      <h2 data-i18n="yours">la tua scena</h2>
      <span class="hint" data-i18n="hint">scegli gli elementi qui sotto: ambiente e ora danno i colori, il resto si mette in fila</span>
      <button id="clear" data-i18n="clear">[ svuota ]</button>
      <button id="random" data-i18n="random">[ a caso ]</button>
    </div>
    <div id="view"><canvas id="stage"></canvas></div>
    <div class="controls">
      <label><span data-i18n="speed">velocità</span> <input id="speed" type="range" min="0" max="3" step="0.1" value="1"></label>
      <label><span data-i18n="density">densità</span> <input id="density" type="range" min="0.3" max="2.5" step="0.1" value="1"></label>
      <button id="pause" data-i18n="pause">[ pausa ]</button>
      <button id="png" data-i18n="png">[ salva immagine ]</button>
      <button id="txt" data-i18n="txt">[ copia testo ]</button>
    </div>
  </section>

  <main id="catalog"></main>

  <footer data-i18n="foot">Gli stessi disegni delle scene della home, letti da <code>scene-catalog.js</code>.</footer>

  <script src="../../i18n.js"></script>
  <script src="../../scene-catalog.js"></script>
  <script src="../../scenes.js"></script>
  <script src="scene.js"></script>
</body>
</html>
